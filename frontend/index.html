<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='25' fill='%234F46E5'/%3E%3Cpath d='M25 70 C38 65 46 65 50 70 C54 65 62 65 75 70' stroke='white' stroke-width='6' stroke-linecap='round' fill='none'/%3E%3Ccircle cx='50' cy='36' r='14' fill='%23FDE047'/%3E%3Ccircle cx='28' cy='32' r='4' fill='%2338BDF8'/%3E%3Ccircle cx='72' cy='32' r='4' fill='%2338BDF8'/%3E%3C/svg%3E" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Knowlix AI - Open-source AI-powered personalized learning platform that transforms photos of handwritten notes, textbook pages, and diagrams into interactive revision sessions with signature 'Teach Me What I Missed' coaching." />
    <meta name="theme-color" content="#4F46E5" />
    <title>Knowlix AI — Learn Smarter. Remember Longer.</title>
    <!-- Google Fonts Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <!-- Immediate theme restoration script to eliminate theme flash -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('knowlix_theme');
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (saved === 'dark' || (!saved && prefersDark)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 antialiased selection:bg-indigo-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
